<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YaalTrail – One-day visits around Chundikuli, Jaffna</title>
    <!-- Leaflet 1.9.x from a CDN. Our stylesheet comes after it so map controls can be restyled. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb" crossorigin="anonymous">
    <link rel="stylesheet" href="css/site.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin="anonymous"></script>
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to places</a>

    <header class="site-header">
        <div class="header-inner">
            <div class="header-top">
                <div class="brand">
                    <h1 class="brand-name">YaalTrail</h1>
                    <p class="brand-tag">One-day visits around Chundikuli, Jaffna</p>
                </div>

                <div class="header-tools">
                    <!-- FR-14: the same filters apply to the list and the map -->
                    <div class="view-toggle" role="group" aria-label="View places as">
                        <button type="button" id="view-list" aria-pressed="true" aria-controls="list-view">List</button>
                        <button type="button" id="view-map" aria-pressed="false" aria-controls="map-view">Map</button>
                    </div>

                    <!-- FR-04: keyword search -->
                    <div class="search-field">
                        <label for="search-input" class="visually-hidden">Search places by name or description</label>
                        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
                            <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                        <input id="search-input" type="search" placeholder="Search places" autocomplete="off">
                    </div>

                    <!-- FR-03: sort order -->
                    <div class="sort-field">
                        <label for="sort-select">Sort</label>
                        <select id="sort-select">
                            <option value="distance">Nearest first</option>
                            <option value="name">Name (A–Z)</option>
                        </select>
                    </div>

                    <!-- Day plan: opens the drawer on narrow screens, jumps to the side panel on wide ones.
                         The badge shows how many places are in the plan. -->
                    <button id="plan-button" type="button" class="plan-button" aria-controls="plan-panel">
                        <span>Day plan</span>
                        <span id="plan-count" class="badge">0</span>
                        <span id="plan-count-label" class="visually-hidden">places in plan</span>
                    </button>
                </div>
            </div>

            <!-- FR-02: multi-select category filter -->
            <div id="category-chips" class="chips" role="group" aria-label="Filter by category"></div>
        </div>
    </header>

    <div class="layout">
    <main id="main" class="page" tabindex="-1">
        <h2 class="visually-hidden">Places</h2>
        <!-- FR-05: number of matching places -->
        <p id="result-count" class="result-count" aria-live="polite"></p>
        <!-- FR-06: empty-state and error messages -->
        <div id="list-message" class="list-message" hidden></div>
        <!-- FR-01: place cards -->
        <div id="list-view">
            <ul id="place-list" class="place-grid"></ul>
        </div>

        <!-- FR-14 to FR-20: interactive map. Hidden until the visitor chooses Map. -->
        <div id="map-view" class="map-view" hidden>
            <div id="map-notice" class="list-message map-notice" role="status"></div>
            <div class="map-layout">
                <div id="map" class="map-canvas"></div>
                <div class="map-side">
                    <h3 id="legend-title" class="legend-title">Legend</h3>
                    <ul id="map-legend" class="map-legend" aria-labelledby="legend-title"></ul>
                    <!-- FR-19: also shown inside the map by the tile layer -->
                    <p class="map-credit">Map data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors</p>
                </div>
            </div>
        </div>
    </main>

    <!-- SRS 4.4, 4.5: day plan. A side panel on wide screens, a drawer on narrow screens.
         Filled in by js/planPanel.js. -->
    <aside id="plan-panel" class="plan-panel" aria-labelledby="plan-title"></aside>
    </div>
    <div id="plan-backdrop" class="plan-backdrop" hidden></div>

    <!-- FR-08: place detail -->
    <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title">
        <div id="detail-content" class="detail"></div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
